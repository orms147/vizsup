name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Base deps only — the suite is pure-Python/headless; [ocr]/[asr]/[desktop]
      # extras pull heavy or Windows-tuned wheels CI doesn't need.
      - name: Install
        run: |
          python -m pip install -e "backend[dev]"
      - name: Lint (ruff)
        run: |
          python -m ruff check backend/app desktop
      - name: Tests
        run: |
          python -m pytest -q
